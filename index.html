<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>NIRINO Monopoly</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet"><style>
:root{--bg:#0b1220;--panel:#121d2e;--line:#29384d;--muted:#91a4bd;--text:#f4f7fb;--gold:#f6c85f;--green:#38c98b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -20%,#243b5c 0,#0b1220 48%);color:var(--text);font-family:Nunito,system-ui,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.brand{font-weight:900;font-size:22px;letter-spacing:.5px}.brand span{color:var(--gold)}.pill{border:1px solid var(--line);background:#152338;border-radius:999px;padding:7px 12px;color:var(--muted);font-size:12px}.panel{background:linear-gradient(145deg,#17253a,#101a2a);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 12px 36px #0003}.lobby{max-width:480px;margin:8vh auto}.h{font-size:24px;font-weight:900;margin:0 0 6px}.sub{color:var(--muted);font-size:14px;margin:0 0 18px}.field{width:100%;background:#0b1525;border:1px solid #34465e;color:white;border-radius:12px;padding:13px;font:inherit;margin:6px 0 12px;outline:none}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--gold);color:#1b2430;font:900 14px Nunito;cursor:pointer}.btn.secondary{background:#263950;color:white;border:1px solid #40536b}.btn:disabled{opacity:.4;cursor:not-allowed}.row{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start}.board-wrap{padding:10px;background:#0c1727;border:1px solid var(--line);border-radius:18px}.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(6,minmax(72px,1fr));gap:5px;aspect-ratio:1/1}.tile{position:relative;background:#e8edf2;color:#172333;border-radius:8px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;min-width:0;overflow:hidden;border:2px solid #ffffff30}.tile .stripe{position:absolute;top:0;left:0;right:0;height:7px}.tile .ico{font-size:clamp(13px,2vw,23px);margin-top:5px}.tile .nm{font-size:clamp(8px,1.05vw,12px);font-weight:900;line-height:1.05;overflow-wrap:anywhere}.tile .price{font-size:clamp(7px,.9vw,10px);font-weight:800;color:#536274}.tokens{display:flex;gap:2px;flex-wrap:wrap;justify-content:center;margin-top:2px}.token{width:13px;height:13px;border-radius:50%;border:2px solid white;box-shadow:0 1px 3px #0008}.center{grid-column:2/6;grid-row:2/6;background:linear-gradient(145deg,#1c304a,#122238);border:1px solid #38506e;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px}.center .logo{font-size:clamp(26px,5vw,52px)}.center h2{font-size:clamp(15px,2vw,23px);margin:4px 0;color:var(--gold);font-weight:900}.center p{font-size:12px;color:var(--muted);margin:0}.side{display:flex;flex-direction:column;gap:12px}.players{display:flex;flex-direction:column;gap:8px}.player{display:flex;align-items:center;gap:9px;background:#0d1828;border:1px solid var(--line);padding:9px;border-radius:12px}.dot{width:13px;height:13px;border-radius:50%;border:2px solid white;flex:none}.player .info{flex:1;min-width:0}.player strong{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.player small{color:var(--muted)}.turn{font-size:11px;color:#10241c;background:#6de0aa;padding:3px 7px;border-radius:999px;font-weight:900}.log{font-size:12px;color:#c2cfdd;line-height:1.45;max-height:190px;overflow:auto}.log div{padding:5px 0;border-bottom:1px solid #ffffff0b}.actionbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{color:var(--muted);font-size:13px;min-height:20px;margin-top:8px}.dice{font-size:28px}.notice{color:#f7d88b;font-weight:800;font-size:13px;min-height:20px;margin-top:8px}.footer{text-align:center;color:#637891;font-size:11px;margin:18px 0}@media(max-width:800px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr}.board{grid-template-rows:repeat(6,minmax(53px,1fr));gap:3px}.board-wrap{padding:6px}.tile{border-radius:5px;padding:4px 2px}.tile .stripe{height:5px}.tile .nm{font-size:clamp(7px,1.8vw,10px)}.tile .price{font-size:7px}.token{width:10px;height:10px}}@media(max-width:460px){.wrap{padding:10px}.side{grid-template-columns:1fr}.board{grid-template-rows:repeat(6,minmax(47px,1fr))}.tile .ico{font-size:12px}.center p{font-size:9px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand">🎲 NIRINO <span>MONOPOLY</span></div><div class="pill">MULTIPLAYER ONLINE</div></header>
<section id="lobby" class="panel lobby"><h1 class="h">Main bareng temanmu</h1><p class="sub">Buat room baru atau masukkan kode room teman. Maksimal 4 pemain.</p><label>Nama pemain</label><input id="name" class="field" maxlength="18" placeholder="Masukkan nama kamu"><button id="create" class="btn" style="width:100%">＋ BUAT ROOM</button><div style="text-align:center;color:#8294aa;margin:15px">— atau gabung room —</div><input id="code" class="field" maxlength="6" placeholder="KODE ROOM" style="text-transform:uppercase"><button id="join" class="btn secondary" style="width:100%">GABUNG ROOM</button><div id="lobbyMsg" class="status"></div></section>
<section id="game" class="hidden"><div class="top"><div><div class="h">Room <span id="roomCode" style="color:var(--gold)"></span></div><div class="sub" id="gameStatus">Menunggu pemain...</div></div><button id="copy" class="btn secondary">🔗 SALIN LINK</button></div><div class="layout"><div><div class="board-wrap"><div id="board" class="board"></div></div><div class="actionbar"><button id="start" class="btn">▶ MULAI</button><button id="roll" class="btn" disabled>🎲 LEMPAR DADU</button><button id="buy" class="btn" disabled>🏠 BELI</button><button id="skip" class="btn secondary" disabled>LEWATI</button></div><div id="notice" class="notice"></div><div id="status" class="status"></div></div><aside class="side"><div class="panel"><h3 style="margin:0 0 10px">👥 PEMAIN</h3><div id="players" class="players"></div></div><div class="panel"><h3 style="margin:0 0 10px">📜 RIWAYAT</h3><div id="log" class="log"></div></div></aside></div></section><div class="footer">NIRINO Monopoly · Main dengan sportif ✨</div></main><script src="/socket.io/socket.io.js"></script><script>
const socket=io();let state=null,myCode=null,amCreator=false;const $=id=>document.getElementById(id);const name=()=> $('name').value.trim()||'Pemain';function msg(t){$('lobbyMsg').textContent=t;}function sendCreate(){socket.emit('create',{name:name()});}function sendJoin(){socket.emit('join',{name:name(),code:$('code').value.trim()});}
$('create').onclick=sendCreate;$('join').onclick=sendJoin;$('code').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));socket.on('created',d=>{myCode=d.code;amCreator=true;showGame();});socket.on('joined',d=>{myCode=d.code;amCreator=false;showGame();});socket.on('errorMsg',msg);function showGame(){$('lobby').classList.add('hidden');$('game').classList.remove('hidden');$('roomCode').textContent=myCode;history.replaceState(null,'','?room='+myCode);}
$('copy').onclick=async()=>{const url=location.origin+'/?room='+myCode;try{await navigator.clipboard.writeText(url);$('status').textContent='Link room berhasil disalin: '+url;}catch{$('status').textContent=url;}};
const query=new URLSearchParams(location.search).get('room');if(query){$('code').value=query.toUpperCase();$('lobbyMsg').textContent='Masukkan nama lalu tekan Gabung Room.';}
$('start').onclick=()=>socket.emit('start');$('roll').onclick=()=>socket.emit('action',{action:'roll'});$('buy').onclick=()=>socket.emit('action',{action:'buy'});$('skip').onclick=()=>socket.emit('action',{action:'skip'});
socket.on('state',s=>{state=s;if(!$('game').classList.contains('hidden'))render();});function tilePos(i){if(i<=5)return [1,i+1];if(i<=10)return [i-4,6];if(i<=15)return [6,16-i];return [20-i,1];}
function render(){if(!state)return;const board=$('board');board.innerHTML='';state.spaces.forEach((s,i)=>{const [r,c]=tilePos(i);const el=document.createElement('div');el.className='tile';el.style.gridRow=r;el.style.gridColumn=c;el.innerHTML=`<div class="stripe" style="background:${s.color}"></div><div class="ico">${s.icon}</div><div class="nm"></div><div class="price"></div><div class="tokens"></div>`;el.querySelector('.nm').textContent=s.name;el.querySelector('.price').textContent=s.type==='property'?`${s.price}🪙${s.owner?' · DIMILIKI':''}`:s.type==='tax'?`-${s.amount}🪙`:'';s.occupants.forEach(p=>{const d=document.createElement('span');d.className='token';d.style.background=p.color;d.title=p.name;el.querySelector('.tokens').appendChild(d);});if(s.owner){const owner=state.players.find(p=>p.id===s.owner);if(owner)el.style.outline=`2px solid ${owner.color}`;}board.appendChild(el);});const center=document.createElement('div');center.className='center';center.innerHTML='<div class="logo">🎲</div><h2>NIRINO MONOPOLY</h2><p id="centerText"></p><p style="margin-top:8px">Beli properti · Kumpulkan sewa · Jadilah sultan!</p>';center.querySelector('#centerText').textContent=state.started?`Giliran: ${state.players[state.turn]?.name||'-'} · Putaran ${state.turns}/40`:'Menunggu permainan dimulai';board.appendChild(center);
$('players').innerHTML='';state.players.forEach((p,i)=>{const el=document.createElement('div');el.className='player';const d=document.createElement('span');d.className='dot';d.style.background=p.color;const inf=document.createElement('div');inf.className='info';const strong=document.createElement('strong');strong.textContent=p.name;const small=document.createElement('small');small.textContent=`💰 ${p.coins.toLocaleString('id-ID')} · Petak ${p.pos+1} · Aset ${netWorth(p).toLocaleString('id-ID')}`;inf.append(strong,small);el.append(d,inf);if(state.started&&state.players[state.turn]?.id===p.id){const t=document.createElement('span');t.className='turn';t.textContent='GILIRAN';el.append(t);}if(!p.active)el.style.opacity='.4';$('players').append(el);});$('log').innerHTML='';state.log.slice().reverse().forEach(x=>{const d=document.createElement('div');d.textContent=x;$('log').append(d);});$('gameStatus').textContent=state.finished?'Permainan selesai':state.started?'Permainan berlangsung':'Lobby · '+state.players.length+'/4 pemain';const me=state.players.find(p=>p.id===socket.id),myTurn=!!(me&&me.active&&state.started&&state.players[state.turn]?.id===socket.id);$('start').classList.toggle('hidden',state.started||!amCreator);$('roll').disabled=!myTurn||state.pending!==null;$('buy').disabled=!myTurn||state.pending===null;$('skip').disabled=!myTurn||state.pending===null;$('status').textContent=myTurn?(state.pending!==null?'Properti tersedia. Pilih Beli atau Lewati.':'Giliranmu! Lempar dadu.'):(state.started?`Menunggu giliran ${state.players[state.turn]?.name||''}`:'Bagikan kode room agar teman bergabung.');$('notice').textContent=state.pending!==null&&myTurn?`🏠 ${state.spaces[state.pending].name} tersedia · Harga ${state.spaces[state.pending].price} koin · Sewa ${state.spaces[state.pending].rent} koin`:'';}
function netWorth(p){return p.coins+state.spaces.reduce((n,s)=>n+(s.owner===p.id?(s.price||0):0),0);}socket.on('connect',()=>{if(query&&!myCode){/* user confirms join with button */}});
</script></body></html>
